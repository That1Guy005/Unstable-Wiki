site_name: Unstable Universe Notes
site_description: Detailed notes on every Unstable Universe episode, character, place, faction and event.
# GitHub Pages address of this site (used for canonical links, the sitemap and the 404 page)
site_url: https://that1guy005.github.io/Unstable-Wiki/
repo_url: https://github.com/That1Guy005/Unstable-Wiki
repo_name: That1Guy005/Unstable-Wiki
edit_uri: ""
copyright: Fan notes. Text written from the Unstable Universe Wiki (CC BY-SA). Thumbnails and images © their creators.

theme:
  name: material
  language: en
  icon:
    logo: material/cube-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tooltips
    - toc.follow

plugins:
  - search
  - tags
  - glightbox:
      skip_classes:
        - off-glb
  - charts

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: vegalite
          class: vegalite
          format: !!python/name:mkdocs_charts_plugin.fences.fence_vegalite

extra_javascript:
  - https://cdn.jsdelivr.net/npm/vega@5
  - https://cdn.jsdelivr.net/npm/vega-lite@5
  - https://cdn.jsdelivr.net/npm/vega-embed@6
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.number.min.js
  - assets/js/tablesort.js
  - assets/js/zoom.js

extra_css:
  - assets/css/extra.css

